name: Accessibility Audit

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "frontend/**"
      - ".github/workflows/accessibility-audit.yml"
  workflow_dispatch:

concurrency:
  group: frontend-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa11y-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run pa11y audit
        working-directory: frontend
        run: npm run a11y:ci
