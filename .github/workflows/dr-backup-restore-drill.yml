name: DR Backup Restore Drill

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backup/restore drill
        run: |
          python scripts/backup_restore_drill.py
