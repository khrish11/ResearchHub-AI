name: Security Scans

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL for OWASP ZAP baseline scan (example: https://app.example.com)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

jobs:
  dependency-and-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Bandit (backend SAST)
        run: |
          mkdir -p security-reports
          bandit -r backend -x backend/venv,backend/tests -ll -f json -o security-reports/bandit.json || true

      - name: Run pip-audit (Python dependencies)
        run: |
          pip-audit -r backend/requirements.txt -f json -o security-reports/pip-audit.json || true

      - name: Run npm audit (frontend dependencies)
        working-directory: frontend
        run: |
          npm audit --json > ../security-reports/npm-audit.json || true

      - name: Install Gitleaks CLI
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks (secret scan)
        run: |
          gitleaks git --no-banner --redact --report-format json --report-path security-reports/gitleaks.json .

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: warn

      - name: Enforce risk gates
        run: |
          python - <<'PY'
          import json, pathlib, sys
          base = pathlib.Path("security-reports")
          bandit_file = base / "bandit.json"
          high_or_critical = 0
          if bandit_file.exists():
              data = json.loads(bandit_file.read_text(encoding="utf-8"))
              for item in data.get("results", []):
                  sev = str(item.get("issue_severity", "")).upper()
                  if sev in {"HIGH", "CRITICAL"}:
                      high_or_critical += 1
          print(f"bandit_high_or_critical={high_or_critical}")
          if high_or_critical > 0:
              print("Failing: high/critical Bandit findings present.")
              sys.exit(1)
          print("Risk gate passed: no high/critical Bandit findings.")
          PY

  owasp-zap-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url }}
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"
