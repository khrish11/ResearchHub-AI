name: Security Scans

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL for OWASP ZAP baseline scan (example: https://app.example.com)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Bandit (backend SAST)
        run: |
          mkdir -p security-reports
          bandit -r backend -x backend/venv,backend/tests -ll -f json -o security-reports/bandit.json || true

      - name: Run pip-audit (Python dependencies)
        run: |
          pip-audit -r backend/requirements.txt -f json -o security-reports/pip-audit.json || true

      - name: Run npm audit (frontend dependencies)
        working-directory: frontend
        run: |
          npm audit --json > ../security-reports/npm-audit.json || true

      - name: Install Gitleaks CLI
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks (secret scan)
        run: |
          gitleaks git --no-banner --redact --report-format json --report-path security-reports/gitleaks.json .

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: warn

      - name: Enforce risk gates
        run: |
          python - <<'PY'
          import json, pathlib, sys
          base = pathlib.Path("security-reports")
          bandit_file = base / "bandit.json"
          pip_audit_file = base / "pip-audit.json"
          npm_audit_file = base / "npm-audit.json"
          gitleaks_file = base / "gitleaks.json"
          high_or_critical = 0
          pip_vulns = 0
          npm_high_or_critical = 0
          gitleaks_findings = 0

          def _load_json(path: pathlib.Path):
            if not path.exists():
              return None
            try:
              return json.loads(path.read_text(encoding="utf-8"))
            except Exception as exc:
              print(f"Failed to parse {path}: {exc}")
              return None

          if bandit_file.exists():
            data = _load_json(bandit_file) or {}
              for item in data.get("results", []):
                  sev = str(item.get("issue_severity", "")).upper()
                  if sev in {"HIGH", "CRITICAL"}:
                      high_or_critical += 1

          pip_data = _load_json(pip_audit_file)
          if isinstance(pip_data, list):
            for dep in pip_data:
              vulns = dep.get("vulns", []) if isinstance(dep, dict) else []
              pip_vulns += len(vulns)
          elif isinstance(pip_data, dict):
            # Backward compatibility in case output shape changes.
            pip_vulns = len(pip_data.get("vulnerabilities", []))

          npm_data = _load_json(npm_audit_file) or {}
          metadata = npm_data.get("metadata", {}) if isinstance(npm_data, dict) else {}
          vulnerabilities = metadata.get("vulnerabilities", {}) if isinstance(metadata, dict) else {}
          npm_high_or_critical = int(vulnerabilities.get("high", 0)) + int(vulnerabilities.get("critical", 0))

          gitleaks_data = _load_json(gitleaks_file)
          if isinstance(gitleaks_data, list):
            gitleaks_findings = len(gitleaks_data)

          print(f"bandit_high_or_critical={high_or_critical}")
          print(f"pip_audit_vulns={pip_vulns}")
          print(f"npm_high_or_critical={npm_high_or_critical}")
          print(f"gitleaks_findings={gitleaks_findings}")

          failed = False
          if high_or_critical > 0:
              print("Failing: high/critical Bandit findings present.")
            failed = True
          if pip_vulns > 0:
            print("Failing: pip-audit vulnerabilities present.")
            failed = True
          if npm_high_or_critical > 0:
            print("Failing: npm audit high/critical vulnerabilities present.")
            failed = True
          if gitleaks_findings > 0:
            print("Failing: gitleaks findings present.")
            failed = True

          if failed:
            sys.exit(1)
          print("Risk gate passed: no blocking findings.")
          PY

  owasp-zap-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url }}
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"
