name: Backend Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-azure-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AZURE_RESOURCE_GROUP: ${{ secrets['AZURE_RESOURCE_GROUP'] }}
      AZURE_CONTAINER_APP_NAME: ${{ secrets['AZURE_CONTAINER_APP_NAME'] }}
      AZURE_ACR_NAME: ${{ secrets['AZURE_ACR_NAME'] }}
      IMAGE_REPOSITORY: researchhub-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for v in AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP_NAME AZURE_ACR_NAME; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set. Configure repository secret: $v"
              exit 1
            fi
          done

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets['AZURE_CREDENTIALS'] }}

      - name: Build image in ACR
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --file backend/Dockerfile \
            backend

      - name: Deploy new image to Container App
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_REF="$AZURE_ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"

          az extension add --name containerapp --upgrade --only-show-errors

          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REF" \
            --output none

          FQDN="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"

          echo "Deployed image: $IMAGE_REF"
          echo "Backend URL: https://$FQDN"
